version: "3.8"

services:
  node-api:
    build: ./node
    container_name: node-health-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000

  go-api:
    build: ./go
    container_name: go-health-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
